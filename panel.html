<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebDebug Pro</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="theme-light">
    <header class="toolbar">
      <div class="title">
        <img src="icons/icon48.png" width="18" height="18" alt="Logo" style="border-radius:4px;" />
        WebDebug Pro
      </div>
      <div class="controls">
        <input id="search" type="search" placeholder="Filter logs…" />
        <label class="chip" data-sev="log"><input type="checkbox" data-filter="log" checked /> log</label>
        <label class="chip" data-sev="info"><input type="checkbox" data-filter="info" checked /> info</label>
        <label class="chip" data-sev="warn"><input type="checkbox" data-filter="warn" checked /> warn</label>
        <label class="chip" data-sev="error"><input type="checkbox" data-filter="error" checked /> error</label>
        <label class="chip" data-sev="network"><input type="checkbox" data-filter="network" checked /> net</label>
        <label class="chip" title="Group duplicate entries"><input type="checkbox" id="group" /> group</label>
        <label class="chip" title="Persist across reloads"><input type="checkbox" id="persist" /> persist</label>
        <label class="chip" title="Pause live updates"><input type="checkbox" id="pause" /> pause</label>
        <label class="chip" id="blacklistChip" style="display:none; color:var(--error); border-color:var(--error); cursor:pointer;" title="Click to clear blacklist">
          Unblock (<span id="blacklistCount">0</span>)
        </label>
        <button id="btnInspect" title="Inspect DOM Element on Page">🔍 Inspect</button>
        <button id="copyAll" title="Copy visible logs">Copy all</button>
        <div class="export">
          <button id="exportBtn">Export ▾</button>
          <div class="menu" id="exportMenu">
            <button data-fmt="json">JSON</button>
            <button data-fmt="txt">TXT</button>
            <button data-fmt="csv">CSV</button>
            <button data-fmt="bugreport">HTML Bug Report</button>
          </div>
        </div>
        <button id="clear" class="danger">Clear</button>
        <button id="theme" title="Toggle theme">🌓</button>
      </div>
    </header>
    <div class="status">
      <div class="tabs">
        <button id="tabLogs" class="tab-btn active">Logs</button>
        <button id="tabStorage" class="tab-btn">Storage</button>
      </div>
      <div>
        <span id="perfWidget" style="margin-right: 8px; color: var(--accent); font-weight: bold;"></span>
        <span id="count">0 entries</span>
        <span id="tabinfo" style="margin-left: 8px;"></span>
      </div>
    </div>
    
    <div id="viewLogs" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
      <main id="list" class="list"></main>
      <div class="console-input">
        <span class="prompt">&gt;</span>
        <input type="text" id="jsInput" placeholder="Evaluate JavaScript (Press Enter)" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <main id="viewStorage" class="list view-storage" style="display:none;">
      <div class="storage-section">
        <div class="storage-head">
          <h3>Local Storage</h3>
          <div><button id="btnRefreshLocal">Refresh</button> <button id="btnClearLocal" class="danger">Clear</button></div>
        </div>
        <div id="outLocal" class="expanded storage-out"></div>
      </div>
      <div class="storage-section">
        <div class="storage-head">
          <h3>Session Storage</h3>
          <div><button id="btnRefreshSession">Refresh</button> <button id="btnClearSession" class="danger">Clear</button></div>
        </div>
        <div id="outSession" class="expanded storage-out"></div>
      </div>
      <div class="storage-section">
        <div class="storage-head">
          <h3>Cookies</h3>
          <div><button id="btnRefreshCookies">Refresh</button> <button id="btnClearCookies" class="danger">Clear</button></div>
        </div>
        <div id="outCookies" class="expanded storage-out"></div>
      </div>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
